[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "benka-integrations"
version = "0.1.0"
description = "Hermes integrations and reversible state migration for Benka"
requires-python = ">=3.14,<3.15"
dependencies = [
    "redis==5.3.1",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "aiohttp==3.14.5",
    "python-dotenv==1.2.4",
    "telethon==1.43.2",
    "apscheduler==3.11.3",
    "pytz==2024.1",
    "httpx==0.28.1",
    "beautifulsoup4==4.14.3",
    "markdownify==0.13.1",
    "pypdf==5.4.0",
    "python-docx==1.1.2",
    "croniter==6.2.4",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
benka = "benka_integrations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "fakeredis==2.31.1", "lupa==2.6"]
hermes = ["hermes-agent", "python-telegram-bot[webhooks]==22.8"]

[tool.uv.sources]
hermes-agent = {path = "vendor/hermes-agent", editable = true}

[tool.uv]
# Match the upstream lock's security fix over browser-harness's exact Pillow pin.
override-dependencies = ["Pillow==13.0.0"]

[tool.pytest.ini_options]
# The vendored runtime ships its own suite. Collecting it from this root would
# run a dependency's tests as if they were this project's.
norecursedirs = ["vendor", ".venv", "node_modules", "docs"]
testpaths = ["tests/hermes"]
