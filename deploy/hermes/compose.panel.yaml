name: benka-hermes-panel

services:
  dashboard:
    image: benka-hermes:candidate
    user: "1000:1000"
    command: [dashboard]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    tmpfs: ["/tmp:size=256m,mode=1777"]
    volumes:
      - ./private/dashboard-manifest.json:/run/benka/manifest.json:ro
      - ./private/state:/state
      - ./private/vault:/vault:ro
    networks: [panel]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2.10@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    ports: ["8451:8443"]
    environment:
      BENKA_PANEL_HOST: ${BENKA_PANEL_HOST:?Set private panel.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./private/tls:/run/tls:ro
    networks: [panel, ingress]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/data:size=16m", "/config:size=16m", "/tmp:size=16m"]
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  ingress: {}
  panel:
    internal: true
