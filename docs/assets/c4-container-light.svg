<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="862" viewBox="0 0 1240 862" role="img" aria-labelledby="t d">
  <title id="t">Container view: the benka-hermes Compose project</title>
  <desc id="d">C4 level 2. Thirteen containers grouped by responsibility: one public edge, the Hermes agent layer, the Redis bus with six workers, and the knowledge services.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2c6070" stroke-opacity=".05"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7b98a3"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0f7d6b"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#a4472c"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2f5fa4"/>
    </marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8a6011"/>
    </marker>
  </defs>
  <rect width="1240" height="862" rx="14" fill="#f6fafb"/>
  <rect width="1240" height="862" rx="14" fill="url(#grid)"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">    <text x="40" y="44" fill="#0f7d6b" font-size="11.5" font-weight="600" letter-spacing="2.2">C4 LEVEL 2 · CONTAINERS</text>
    <text x="40" y="71" fill="#0e222c" font-size="21" font-weight="700">benka-hermes · 13 services on one host</text>
    <text x="40" y="98" text-anchor="start" fill="#5f7d89" font-size="11">Only one container has a published listener. Everything else binds internally.</text>
    <rect x="36" y="120" width="268" height="150" rx="12" fill="#ecf3f5" stroke="#cadbe1" stroke-dasharray="6 5"/>
    <text x="52" y="144" fill="#a4472c" font-size="12.5" font-weight="600" letter-spacing="1.9">PUBLIC EDGE</text>
    <rect x="56" y="156" width="228" height="92" rx="9" fill="#fbeae5" stroke="#dda694" stroke-width="1.4"/>
    <text x="70" y="178" fill="#a4472c" font-size="10.5" font-weight="600" letter-spacing="1.4">THE ONLY PUBLISHED PORT</text>
    <text x="70" y="199" fill="#0e222c" font-size="15" font-weight="600">caddy</text>
    <text x="70" y="217" fill="#476470" font-size="11.5">TLS + mTLS on :8451</text>
    <text x="70" y="232" fill="#476470" font-size="11.5">Client certificate required</text>
    <rect x="330" y="120" width="500" height="150" rx="12" fill="#ecf3f5" stroke="#cadbe1" stroke-dasharray="6 5"/>
    <text x="346" y="144" fill="#0f7d6b" font-size="12.5" font-weight="600" letter-spacing="1.9">HERMES AGENT LAYER</text>
    <rect x="350" y="156" width="208" height="92" rx="9" fill="#e2f5f1" stroke="#63bfb0" stroke-width="1.4"/>
    <text x="364" y="178" fill="#0f7d6b" font-size="10.5" font-weight="600" letter-spacing="1.4">ORCHESTRATION</text>
    <text x="364" y="199" fill="#0e222c" font-size="15" font-weight="600">gateway</text>
    <text x="364" y="217" fill="#476470" font-size="11.5">Telegram polling · profiles</text>
    <text x="364" y="232" fill="#476470" font-size="11.5">native tools · cron owner</text>
    <rect x="602" y="156" width="208" height="92" rx="9" fill="#e2f5f1" stroke="#63bfb0" stroke-width="1.4"/>
    <text x="616" y="178" fill="#0f7d6b" font-size="10.5" font-weight="600" letter-spacing="1.4">OPERATOR UI</text>
    <text x="616" y="199" fill="#0e222c" font-size="15" font-weight="600">dashboard</text>
    <text x="616" y="217" fill="#476470" font-size="11.5">Shares the Gateway</text>
    <text x="616" y="232" fill="#476470" font-size="11.5">PID + network namespace</text>
    <rect x="856" y="120" width="348" height="150" rx="12" fill="#ecf3f5" stroke="#cadbe1" stroke-dasharray="6 5"/>
    <text x="872" y="144" fill="#8a6011" font-size="12.5" font-weight="600" letter-spacing="1.9">MODEL ROUTING</text>
    <rect x="876" y="156" width="308" height="92" rx="9" fill="#fbf1de" stroke="#d9b878" stroke-width="1.4"/>
    <text x="890" y="178" fill="#8a6011" font-size="10.5" font-weight="600" letter-spacing="1.4">ASSIGNED WORKLOADS ONLY</text>
    <text x="890" y="199" fill="#0e222c" font-size="15" font-weight="600">omniroute</text>
    <text x="890" y="217" fill="#476470" font-size="11.5">Own provider and OAuth state</text>
    <text x="890" y="232" fill="#476470" font-size="11.5">Not the universal route for every call</text>
    <rect x="36" y="300" width="1168" height="256" rx="12" fill="#ecf3f5" stroke="#cadbe1" stroke-dasharray="6 5"/>
    <text x="52" y="324" fill="#2f5fa4" font-size="12.5" font-weight="600" letter-spacing="1.9">EXECUTION LAYER · one slot, one run</text>
    <rect x="56" y="340" width="236" height="174" rx="9" fill="#e8f0fb" stroke="#8fb2dd" stroke-width="1.4"/>
    <text x="70" y="362" fill="#2f5fa4" font-size="10.5" font-weight="600" letter-spacing="1.4">INTEGRATION BUS</text>
    <text x="70" y="383" fill="#0e222c" font-size="15" font-weight="600">redis</text>
    <text x="70" y="401" fill="#476470" font-size="11.5">Streams + consumer groups</text>
    <text x="70" y="416" fill="#476470" font-size="11.5">Slot dedupe · pending list</text>
    <text x="70" y="431" fill="#476470" font-size="11.5">Delivery receipts</text>
    <text x="70" y="446" fill="#476470" font-size="11.5">benka:reconcile</text>
    <text x="70" y="461" fill="#476470" font-size="11.5">AOF-persisted</text>
    <rect x="316" y="340" width="276" height="78" rx="9" fill="#ffffff" stroke="#b4cbd3" stroke-width="1.4"/>
    <text x="330" y="365" fill="#0e222c" font-size="15" font-weight="600">worker-email-personal</text>
    <text x="330" y="383" fill="#476470" font-size="11.5">Personal mailbox, digests</text>
    <rect x="612" y="340" width="276" height="78" rx="9" fill="#ffffff" stroke="#b4cbd3" stroke-width="1.4"/>
    <text x="626" y="365" fill="#0e222c" font-size="15" font-weight="600">worker-email-work</text>
    <text x="626" y="383" fill="#476470" font-size="11.5">Work mailbox, triage</text>
    <rect x="908" y="340" width="276" height="78" rx="9" fill="#ffffff" stroke="#b4cbd3" stroke-width="1.4"/>
    <text x="922" y="365" fill="#0e222c" font-size="15" font-weight="600">worker-telegram</text>
    <text x="922" y="383" fill="#476470" font-size="11.5">Channel digest, Telethon</text>
    <rect x="316" y="436" width="276" height="78" rx="9" fill="#ffffff" stroke="#b4cbd3" stroke-width="1.4"/>
    <text x="330" y="461" fill="#0e222c" font-size="15" font-weight="600">worker-signals</text>
    <text x="330" y="479" fill="#476470" font-size="11.5">Rules, alerts, mini-batches</text>
    <rect x="612" y="436" width="276" height="78" rx="9" fill="#ffffff" stroke="#b4cbd3" stroke-width="1.4"/>
    <text x="626" y="461" fill="#0e222c" font-size="15" font-weight="600">worker-last30days</text>
    <text x="626" y="479" fill="#476470" font-size="11.5">Personal Feed, Platform Pulse</text>
    <rect x="908" y="436" width="276" height="78" rx="9" fill="#ffffff" stroke="#b4cbd3" stroke-width="1.4"/>
    <text x="922" y="461" fill="#0e222c" font-size="15" font-weight="600">worker-maintenance</text>
    <text x="922" y="479" fill="#476470" font-size="11.5">Wiki lifecycle, LightRAG upkeep</text>
    <path d="M292 379H316" fill="none" stroke="#2f5fa4" stroke-width="1.6" marker-end="url(#arb)"/>
    <path d="M292 475H316" fill="none" stroke="#2f5fa4" stroke-width="1.6" marker-end="url(#arb)"/>
    <text x="52" y="540" text-anchor="start" fill="#2f5fa4" font-size="11">Each worker: its own manifest, config, cursor, consumer group, and one allowlisted delivery route — a worker cannot choose a destination from the content it just read.</text>
    <rect x="36" y="596" width="1168" height="176" rx="12" fill="#ecf3f5" stroke="#cadbe1" stroke-dasharray="6 5"/>
    <text x="52" y="620" fill="#8a6011" font-size="12.5" font-weight="600" letter-spacing="1.9">KNOWLEDGE SERVICES</text>
    <rect x="56" y="638" width="356" height="100" rx="9" fill="#fbf1de" stroke="#d9b878" stroke-width="1.4"/>
    <text x="70" y="660" fill="#8a6011" font-size="10.5" font-weight="600" letter-spacing="1.4">SOURCE OF TRUTH</text>
    <text x="70" y="681" fill="#0e222c" font-size="15" font-weight="600">wiki</text>
    <text x="70" y="699" fill="#476470" font-size="11.5">Writes source-backed Markdown first,</text>
    <text x="70" y="714" fill="#476470" font-size="11.5">then asks LightRAG to index it</text>
    <rect x="444" y="638" width="356" height="100" rx="9" fill="#fbf1de" stroke="#d9b878" stroke-width="1.4"/>
    <text x="458" y="660" fill="#8a6011" font-size="10.5" font-weight="600" letter-spacing="1.4">DERIVED INDEX</text>
    <text x="458" y="681" fill="#0e222c" font-size="15" font-weight="600">lightrag</text>
    <text x="458" y="699" fill="#476470" font-size="11.5">Graph + vector retrieval over an</text>
    <text x="458" y="714" fill="#476470" font-size="11.5">explicit allowlist of roots</text>
    <rect x="832" y="638" width="372" height="100" rx="9" fill="#ffffff" stroke="#b4cbd3" stroke-width="1.4"/>
    <text x="846" y="660" fill="#476470" font-size="10.5" font-weight="600" letter-spacing="1.4">READ-ONLY INPUT</text>
    <text x="846" y="681" fill="#0e222c" font-size="15" font-weight="600">Vault + private archive</text>
    <text x="846" y="699" fill="#476470" font-size="11.5">Owner-editable Obsidian Markdown; SQLite FTS</text>
    <text x="846" y="714" fill="#476470" font-size="11.5">archive searched only on explicit request</text>
    <path d="M284 202H350" fill="none" stroke="#a4472c" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="317" y="194" text-anchor="middle" fill="#a4472c" font-size="11">proxy</text>
    <path d="M558 202H602" fill="none" stroke="#0f7d6b" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ara)" marker-start="url(#ara)"/>
    <path d="M810 202H876" fill="none" stroke="#7b98a3" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar)"/>
    <path d="M454 248V286H174V340" fill="none" stroke="#0f7d6b" stroke-width="1.6" marker-end="url(#ara)"/>
    <text x="462" y="282" text-anchor="start" fill="#0f7d6b" font-size="11">cron enqueues one job per slot</text>
    <path d="M300 556V638" fill="none" stroke="#7b98a3" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar)"/>
    <text x="308" y="604" text-anchor="start" fill="#5f7d89" font-size="11">workers write</text>
    <path d="M412 688H444" fill="none" stroke="#8a6011" stroke-width="1.6" marker-end="url(#arm)"/>
    <text x="428" y="712" text-anchor="middle" fill="#8a6011" font-size="11">index</text>
    <path d="M832 688H804" fill="none" stroke="#7b98a3" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar)"/>
    <text x="1204" y="812" text-anchor="end" fill="#5f7d89" font-size="11">ADR-0003 · ADR-0005 · ADR-0010</text>
  </g>
</svg>
