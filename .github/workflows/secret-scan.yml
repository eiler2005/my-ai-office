name: Secret scan

# This repository is public and holds the configuration of a system that reads the
# owner's mail and messages. The one thing CI must guarantee is that nothing secret
# is ever published. See docs/adr/0011-verification-on-the-vps-not-in-ci.md for why
# CI does not do more than this.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: a workflow in a public repository is itself an attack surface.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: History and working tree
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The project scanner walks every reachable blob, not just the tip.
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install --disable-pip-version-check "detect-secrets==1.5.0"

      - name: Project secret scan
        # Walks every reachable Git blob plus the working tree against a reviewed
        # allowlist. Runs detect-secrets with --no-verify, so no discovered
        # credential is ever submitted to a provider. Reports hashes and
        # locations, never plaintext.
        run: python3 scripts/scan-git-secrets.py

      - name: Gitleaks
        # A second, independent ruleset. Two scanners disagree usefully.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
