# Pins are deliberate here -- see docs/adr/0012-vendor-hermes-as-a-pinned-submodule.md.
# Dependabot proposes bumps; it never merges them. Every bump to a runtime pin
# requires re-running the native-contract checks and the regressions on the VPS.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
