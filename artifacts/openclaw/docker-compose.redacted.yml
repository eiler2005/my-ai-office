services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE}
    cpus: "0.90"
    mem_limit: 1224m
    memswap_limit: 1224m
    pids_limit: 256
    environment:
      HOME: /home/node
      TERM: xterm-256color
      NODE_OPTIONS: ${OPENCLAW_NODE_OPTIONS:---max-old-space-size=768}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      WIKI_IMPORT_URL: http://wiki-import:8095
      WIKI_IMPORT_TOKEN_FILE: /run/secrets/wiki_import_token
      TZ: ${OPENCLAW_TZ:-UTC}
      OPENCLAW_TELEGRAM_ISOLATED_INGRESS: ${OPENCLAW_TELEGRAM_ISOLATED_INGRESS:-0}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - /opt/obsidian-vault:/opt/obsidian-vault:rw
      - /opt/openclaw/secrets/wiki_import_token:/run/secrets/wiki_import_token:ro
    ports:
      - "${OPENCLAW_GATEWAY_PORT}:18789"
      - "${OPENCLAW_BRIDGE_PORT}:18790"
    init: true
    restart: on-failure:5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured", "--bind", "lan", "--port", "18789", "--force"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:18789/healthz',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1)});\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  openclaw-cli:
    profiles: ["tools"]
    image: ${OPENCLAW_IMAGE}
    network_mode: "service:openclaw-gateway"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      WIKI_IMPORT_URL: http://wiki-import:8095
      WIKI_IMPORT_TOKEN_FILE: /run/secrets/wiki_import_token
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-UTC}
      OPENCLAW_TELEGRAM_ISOLATED_INGRESS: ${OPENCLAW_TELEGRAM_ISOLATED_INGRESS:-0}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - /opt/obsidian-vault:/opt/obsidian-vault:rw
      - /opt/openclaw/secrets/wiki_import_token:/run/secrets/wiki_import_token:ro
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "openclaw.mjs"]

# NOTE: docker-compose.override.yml (not committed) adds the omniroute service.
# See artifacts/omniroute/docker-compose.override.yml for the redacted version.
